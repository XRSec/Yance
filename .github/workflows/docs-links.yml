name: Scheduled Docs Links

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7.0.1
        uses: "actions/checkout@\
          3d3c42e5aac5ba805825da76410c181273ba90b1"
      - name: Check all documentation links
        # v2.9.0
        uses: "lycheeverse/lychee-action@\
          e7477775783ea5526144ba13e8db5eec57747ce8"
        with:
          args: >-
            --config .lychee.toml
            --max-retries 3
            --timeout 30
            --no-progress
            docs/**/*.md README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md
          fail: true
