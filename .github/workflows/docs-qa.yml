name: Docs QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7.0.1
        uses: "actions/checkout@\
          3d3c42e5aac5ba805825da76410c181273ba90b1"
      - name: Check front matter, links, JSON, schemas, and fixtures
        run: python3 scripts/docs_qa.py
      - name: Test the standard-library schema validator
        run: python3 -m unittest scripts/test_docs_qa.py
      - name: Markdownlint
        # v24.2.0
        uses: "DavidAnson/markdownlint-cli2-action@\
          21c1be1b93ad9ed58fa840aacc3f279cde2a72ff"
        with:
          globs: "**/*.md"
      - name: Lightweight external link check
        # v2.9.0
        uses: "lycheeverse/lychee-action@\
          e7477775783ea5526144ba13e8db5eec57747ce8"
        with:
          args: >-
            --config .lychee.toml
            --max-retries 1
            --timeout 10
            --no-progress
            docs/**/*.md README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md
          fail: true
